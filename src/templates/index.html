{% extends "layout.html" %}
{% block body %}
  {% if g.user %}
    <p>
      Hello {{ g.user.screen_name }}!  Wanna tweet something?
    </p>
  {% else %}
    <p>
      Sign in to start the fun!
    </p>
    <p>
      <a href="{{ url_for('login') }}"><img src="{{
        url_for('static', filename='sign-in.png') }}" alt="sign in"></a>
    </p>
  {% endif %}
{% endblock %}
