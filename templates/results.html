{% extends 'base.html' %}
{% block content %}
    <script>
	    window.onload = function () {
	    	var obj = {{ results|tojson }};
			var dict = {"total_mem_accesses": "Total Memory Accesses", "target_instructions": "Target Instructions", "host_initialization_time": "Host Initialization Time", "l1cache_accesses": "L1 Cache Accesses", "target_time": "Target Time (nanoseconds)", "host_time": "Host Time (microseconds)", "host_working_time": "Host Working Time (microseconds)", "l2cache_accesses": "L2 Cache Accesses", "memory": "Memory (KB)", "avg_packet_latency": "Average Packet Latency (nanoseconds)", "total_dram_accesses": "Total Dram Accesses", "host_shutdown_time": "Host Shutdown Time (microseconds)", "total_bits_sent": "Total Bits Sent", "total_flits_received": "Total Flits Received", "l1cache_misses": "L1 Cache Misses", "avg_dram_latency": "Average Dram Latency (nanoseconds)", "total_flits_sent": "Total Flits Sent", "total_bits_received": "Total Bits Received", "num_cores": "Number of Cores", "execution_units": "Execution Units", "l2cache_misses": "L2 Cache Misses", "total_packets_sent": "Total Packets Sent", "l2miss_rate": "L2 Miss Rate"}
			for(var key in obj){
				if ((key != "host_initialization_time") && (key != "host_time") && (key != "host_working_time") && (key != "host_shutdown_time") && (key != "num_cores")){
					var dps = [];
					for(i = 0; i < obj[key].length; i++){
						dps.push({y: obj[key][i], label: "Core " + (i+1)});
					}
					var chart = new CanvasJS.Chart("chartContainer_"+key, {
						title:{
							text:dict[key]				
						},
				        animationEnabled: true,
						axisX:{
							interval: 1,
							gridThickness: 0,
							labelFontSize: 10,
							labelFontStyle: "normal",
							labelFontWeight: "normal",
							labelFontFamily: "Lucida Sans Unicode"

						},
						axisY2:{
							interlacedColor: "rgba(1,77,101,.2)",
							gridColor: "rgba(1,77,101,.1)"

						},
						data: [
						{     
							type: "bar",
				            		name: "",
							axisYType: "secondary",
							color: "#014D65",				
							dataPoints: dps,
						}
						
						]
					});
				chart.render();
				}
			}
		}
		
    </script>
	<div class="row">
		<div class="col-xs-6">
			<div id="chartContainer_total_mem_accesses" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_target_instructions" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_l1cache_accesses" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_target_time" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_l2cache_accesses" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_memory" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_avg_packet_latency" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_total_dram_accesses" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_total_bits_sent" style="height: 300px; width: 100%;"></div>
		</div>
		<div class="col-xs-6">
			<div id="chartContainer_l1cache_misses" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_avg_dram_latency" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_total_flits_sent" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_total_bits_received" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_execution_units" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_l2cache_misses" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_total_packets_sent" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_l2miss_rate" style="height: 300px; width: 100%;"></div>
			<div id="chartContainer_total_flits_received" style="height: 300px; width: 100%;"></div>
		</div>	
	</div>
{% endblock %}
