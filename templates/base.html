<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% block full_title %}{% block title %}{% endblock %} - Simon{% endblock %}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='microchip-60@3x.ico') }}"/>
    <link rel="stylesheet" type="text/css" href="//maxcdn.bootstrapcdn.com/bootswatch/3.2.0/united/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" href="//maxcdn.bootstrapcdn.com/font-awesome/4.1.0/css/font-awesome.min.css"/>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='app.css') }}"/>
</head>
<body>
    <header>
        <nav class="navbar navbar-default navbar-static-top">
            <div class="container">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#base-nav-collapse"><i class="fa fa-bars"></i></button>
                    <a href="{{ url_for('index') }}" class="navbar-brand"><strong>Simon</strong></a>
                </div>
                <div class="collapse navbar-collapse" id="base-nav-collapse">
                    <ul class="nav navbar-nav">
                        <li class="{% block nav_docs %}{% endblock %}"><a href="{{ url_for('show_docs') }}">Documentation</a></li>
                        <li class="{% block nav_developers %}{% endblock %}"><a href="{{ url_for('show_dev') }}">Developers</a></li>
                        <li class="{% block nav_sim %}{% endblock %}"><a href="{{ url_for('run_simulation') }}">Run Simulation</a></li>
                        <li class="{% block nav_results %}{% endblock %}"><a href="{{ url_for('get_results') }}">Results</a></li>
                        <li class="{% block nav_faq %}{% endblock %}"><a href="{{ url_for('show_faq') }}">FAQ</a></li>
                    </ul>
                    <ul class="nav navbar-nav navbar-right">
                        {% if g.user%}
                            <li><a href="{{ url_for('logout') }}">Log Out</a></li>
                        {% else %}
                            <li><a href="{{ url_for('login') }}">Log In</a></li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
    <script type="text/javascript" src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
    <script type="text/javascript" src="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
</body>
</html>
